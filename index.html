<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1230; --plum:#2c1a48; --rose:#f2a6b8; --blush:#ffd9e2; --gold:#e8c27a; --ink:#fff3f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--plum),var(--night) 70%) fixed;
  color:var(--ink);font-family:'Cormorant Garamond',serif;overflow-x:hidden;
}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.h{position:absolute;bottom:-40px;opacity:.0;animation:rise linear forwards;color:var(--rose)}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.5}100%{opacity:0;transform:translateY(-110vh) scale(1.2) rotate(25deg)}}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity 1.2s ease,visibility 1.2s}
#gate.gone{opacity:0;visibility:hidden}
.envelope{width:min(92vw,380px);text-align:center;position:relative}
.seal{width:150px;height:150px;margin:0 auto 28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff9db3,#c2406a 70%);
  box-shadow:0 0 0 6px rgba(255,255,255,.06),0 18px 50px rgba(194,64,106,.45);
  display:grid;place-items:center;font-family:'Pinyon Script',cursive;font-size:62px;color:var(--blush);
  animation:beat 2.4s ease-in-out infinite;transition:transform .8s ease}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hint{font-size:22px;font-style:italic;color:var(--blush);margin-bottom:18px}
.field{display:flex;gap:8px;direction:ltr}
.field input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,217,226,.35);
  border-radius:999px;padding:14px 20px;font:inherit;font-size:20px;color:var(--ink);text-align:center;outline:none}
.field input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,194,122,.3)}
.field button{border:0;border-radius:999px;padding:0 22px;font:inherit;font-size:20px;font-weight:500;cursor:pointer;
  background:var(--gold);color:#3a2308}
.field button:focus-visible{outline:3px solid var(--blush);outline-offset:2px}
#err{height:26px;margin-top:12px;font-size:18px;color:var(--rose);font-style:italic}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---------- site ---------- */
#site{position:relative;z-index:1;opacity:0;visibility:hidden;transition:opacity 1.6s ease .4s;padding:0 20px 100px}
#site.show{opacity:1;visibility:visible}
header{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
header h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(88px,26vw,200px);line-height:1;
  background:linear-gradient(180deg,var(--blush),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{font-size:22px;font-style:italic;color:var(--blush);opacity:.8;margin-top:8px}
.down{margin-top:40px;font-size:28px;color:var(--gold);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(10px)}}

.letter{max-width:620px;margin:0 auto 90px;padding:44px 32px;border-radius:6px;
  background:linear-gradient(160deg,#fff6ef,#ffe9ee);color:#4a2236;
  box-shadow:0 30px 70px rgba(0,0,0,.45);transform:rotate(-1deg);position:relative}
.letter::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(194,64,106,.35);border-radius:3px;pointer-events:none}
#msg{font-family:'Caveat',cursive;font-size:clamp(24px,5.4vw,31px);line-height:1.55;direction:ltr;text-align:left;
  white-space:pre-wrap;min-height:12em;word-break:break-word}
.caret{display:inline-block;width:2px;height:1em;background:#c2406a;margin-left:2px;vertical-align:-.12em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

section.media{max-width:980px;margin:0 auto 80px}
section.media h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:46px;text-align:center;color:var(--blush);margin-bottom:28px}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.polaroid{background:#fff7f2;padding:12px 12px 14px;border-radius:3px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.polaroid:nth-child(odd){transform:rotate(-1.6deg)}
.polaroid:nth-child(even){transform:rotate(1.4deg)}
.slot{aspect-ratio:4/5;background:#f1dde2;border-radius:2px;overflow:hidden;display:grid;place-items:center;position:relative}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:none;text-align:center;padding:16px;color:#8a4a62;font-family:'Caveat',cursive;font-size:24px;line-height:1.3;direction:ltr}
.slot.empty .ph{display:block}
.slot.empty img{display:none}
.ph b{display:block;font-family:'Cormorant Garamond',serif;font-size:16px;direction:ltr;margin-top:6px;opacity:.75}
footer{text-align:center;font-family:'Pinyon Script',cursive;font-size:38px;color:var(--rose);padding-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>

<!-- Gate -->
<div id="gate">
  <div class="envelope" id="env">
    <div class="seal" id="seal">L</div>
    <p class="hint">Enter the password, Lilo</p>
    <div class="field">
      <input id="pw" type="password" autocomplete="off" aria-label="Password" placeholder="••••••">
      <button id="go" type="button">Open</button>
    </div>
    <div id="err" role="alert"></div>
  </div>
</div>

<!-- Site -->
<main id="site">
  <header>
    <h1>Lilo</h1>
    <p>This is for you</p>
    <div class="down">&#8964;</div>
  </header>

  <div class="letter"><div id="msg"></div></div>

  <section class="media">
    <h2>Our photos</h2>
    <div class="photos" id="photos"></div>
  </section>

  <footer>Always yours</footer>
</main>

<script>
/* ========= Settings ========= */
const PASSWORD = "celia";            // not case sensitive
const PHOTOS   = [1,2,3,5,6];        // photos: 1, 2, 3, 5, 6
const PHOTO_EXT = ['jpg','jpeg','png','webp','jfif','gif','JPG','JPEG','PNG','WEBP'];
const MESSAGE  =
`    liloo bahbkk ya liloooo entyyy bnsbaly 7aga kbera bgd w msh 3awez asybkkk ana 3awzk entyy w msh 3awez azlmk wala el 3bttt bs ana bahbkk msh h2ol kalam momkn  ydy22 mny dlw ana b3mlk dh 3shan abstk wasl7k mn ay 7aga  momkn tb2y z3lana mny fyha bss ely 3awez a2olk 3lyha eny bahbkkkkkkkkk awyyyyyyyyyy w daymn hfdl abstk w msh hz3lk mny fe 7aga`;
/* ============================ */

const $ = id => document.getElementById(id);

/* Floating hearts */
(function hearts(){
  const box=$('hearts');
  setInterval(()=>{
    const s=document.createElement('span');
    s.className='h'; s.textContent='\u2665';
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(12+Math.random()*22)+'px';
    s.style.animationDuration=(7+Math.random()*7)+'s';
    box.appendChild(s); setTimeout(()=>s.remove(),15000);
  },700);
})();

/* Load photos with any extension, show placeholder if file is missing */
function tryExt(el, base, exts, onFail){
  let i=0;
  const next=()=>{ if(i>=exts.length){onFail();return;} el.src=base+'.'+exts[i++]; };
  el.addEventListener('error',next);
  next();
}
function build(){
  const photos=$('photos');
  PHOTOS.forEach(n=>{
    const fig=document.createElement('figure'); fig.className='polaroid';
    fig.innerHTML=`<div class="slot"><img alt="Photo ${n}" loading="lazy"><div class="ph">Put photo ${n} here<b>${n}.jpg</b></div></div>`;
    const slot=fig.querySelector('.slot'), img=fig.querySelector('img');
    tryExt(img,String(n),PHOTO_EXT,()=>slot.classList.add('empty'));
    photos.appendChild(fig);
  });
}
build();

/* Typewriter message */
function typeMsg(){
  const el=$('msg'); let i=0;
  const caret=document.createElement('span'); caret.className='caret';
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){ el.textContent=MESSAGE; return; }
  el.appendChild(caret);
  const t=setInterval(()=>{
    caret.before(document.createTextNode(MESSAGE[i++]));
    if(i>=MESSAGE.length){clearInterval(t);setTimeout(()=>caret.remove(),1500);}
  },42);
}

/* Password */
function unlock(){
  const v=$('pw').value.trim().toLowerCase();
  if(v===PASSWORD){
    $('err').textContent='';
    $('seal').style.transform='scale(1.5)';
    $('gate').classList.add('gone');
    $('site').classList.add('show');
    for(let k=0;k<18;k++) setTimeout(()=>{
      const s=document.createElement('span'); s.className='h'; s.textContent='\u2665';
      s.style.left=Math.random()*100+'vw'; s.style.fontSize=(18+Math.random()*30)+'px';
      s.style.animationDuration=(4+Math.random()*4)+'s'; $('hearts').appendChild(s);
    },k*90);
    setTimeout(typeMsg,1800);
  }else{
    $('err').textContent='Not that one.. try again, Lilo';
    const e=$('env'); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake');
    $('pw').select();
  }
}
$('go').addEventListener('click',unlock);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
</body>
</html>
